<!DOCTYPE html>
<html lang="en">
  <head>
    <title>FinePrint</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-light" data-bs-theme="light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">FinePrint</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor03" aria-controls="navbarColor03" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor03">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home
                <span class="visually-hidden">(current)</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Features</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Support</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">More</a>
              <div class="dropdown-menu">
                <a class="dropdown-item" href="#">Action</a>
                <a class="dropdown-item" href="#">Another action</a>
                <a class="dropdown-item" href="#">Something else here</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#">Separated link</a>
              </div>
            </li>
          </ul>
          <form class="d-flex">
            <input class="form-control me-sm-2" type="search" placeholder="Search">
            <button class="btn btn-secondary my-2 my-sm-0" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
    <div class="container py-5">
      <!-- About Section -->
      <div>
        <div class="mb-3">
          <img src="images/logo.png" width="400" height="250">
        </div>
        <div class="mb-3">
          <p>Transform your legal documents into simple jargon.</p>
        </div>
      </div>
      <!-- Input Section -->
      <div class="card shadow-sm p-4 mb-4">
        <div class="mb-3">
          <h2 class="mb-3">Enter text or upload file</h2>
        </div>
        <div class="mb-3">
          <input type="text" placeholder="Enter text here...">
        </div>
        <div class="mb-3">
          <input type="file">
        </div>
        <div class="mb-3">
          <input type="submit">
        </div>
      </div>
      <!-- Summary Section -->
      <div class="card shadow-sm p-4 mb-4">
        <div class="mb-3">
          <h2 class="mb-3">Summary</h2>
        </div>
        <div class="mb-3">
          <p>Text will appear here.</p>
        </div>
      </div>
    </div>
  </body>
</html>
